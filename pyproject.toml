[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spexpi"
version = "0.1.0"
description = "SPHEREx spectrum extraction pipeline for aperture and PSF photometry of point sources"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Frank Kiwy" }
]
keywords = [
    "SPHEREx",
    "astronomy",
    "spectrophotometry",
    "brown dwarfs",
    "aperture photometry",
    "PSF photometry"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
    "numpy>=2.4.6",
    "astropy>=7.2.0",
    "matplotlib>=3.10.9",
    "scipy>=1.17.1",
    "photutils>=3.0.0",
    "pyvo>=1.8.1",
    "requests>=2.34.2",
    "pillow>=12.2.0",
    "tqdm>=4.67.3",
    "pandas>=3.0.3",
    "fsspec>=2026.4.0",
    "s3fs>=2026.4.0",
    "reproject>=0.19.0"
]

[project.urls]
Homepage = "https://github.com/fkiwy"
Repository = "https://github.com/fkiwy/spexpi"
Issues = "https://github.com/fkiwy/spexpi/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
